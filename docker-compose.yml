services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-ai-robot}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-strong-secret-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FAST_MODEL=${FAST_MODEL:-gemini-3.5-flash-lite}
      - VOICE_MODEL=${VOICE_MODEL:-gemini-3.8-live}
      - VOICE_MODE=${VOICE_MODE:-native}
      - AI_SERVICE_URL=http://ai-services:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - robot-net

  ai-services:
    build:
      context: apps/ai-services
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FAST_MODEL=${FAST_MODEL:-gemini-3.5-flash-lite}
      - VOICE_MODEL=${VOICE_MODEL:-gemini-3.8-live}
    expose:
      - "8000"
    networks:
      - robot-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379" # Bound to localhost only
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robot-net

volumes:
  redis-data:

networks:
  robot-net:
    driver: bridge
