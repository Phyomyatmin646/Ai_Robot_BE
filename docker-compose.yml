services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/ai-robot}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-ai-robot}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-strong-secret-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - FAST_MODEL=${FAST_MODEL:-gemini-2.0-flash}
      - THINKING_MODEL=${THINKING_MODEL:-gemini-2.0-pro}
      - VOICE_MODEL=${VOICE_MODEL:-gemini-2.0-flash-live}
      - VOICE_MODE=${VOICE_MODE:-native}
      - AI_SERVICE_URL=http://ai-services:8000
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_HOST=0.0.0.0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    ports:
      - "3000:3000"
      - "1883:1883"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - robot-net

  ai-services:
    build:
      context: apps/ai-services
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - FAST_MODEL=${FAST_MODEL:-gemini-2.0-flash}
      - THINKING_MODEL=${THINKING_MODEL:-gemini-2.0-pro}
      - VOICE_MODEL=${VOICE_MODEL:-gemini-2.0-flash-live}
    ports:
      - "8000:8000"
    networks:
      - robot-net

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai-robot
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "127.0.0.1:27017:27017" # Bound to localhost only for security
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robot-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379" # Bound to localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robot-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - robot-net

volumes:
  mongo-data:
  redis-data:

networks:
  robot-net:
    driver: bridge

