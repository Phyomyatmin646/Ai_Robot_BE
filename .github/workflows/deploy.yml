name: CI/CD Pipeline - AI Robot Backend

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  # -------------------------------------------------------------
  # Job 1: Build, Lint & Automated Tests
  # -------------------------------------------------------------
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build TypeScript Packages & Backend
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=apps/backend

      - name: Run Backend Unit Tests
        run: npm test

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/ai-services/requirements.txt'

      - name: Install Python AI Services Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-services/requirements.txt

      - name: Test Python AI Services Syntax & Imports
        run: |
          python -c "import app.main; print('FastAPI app imports successfully')"
        working-directory: apps/ai-services

  # -------------------------------------------------------------
  # Job 2: Automated Deployment to AWS EC2 via SSH
  # -------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Connecting to EC2 for AI Robot deployment..."

            # Determine project directory on EC2
            PROJECT_DIR="${{ secrets.EC2_PROJECT_PATH }}"
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="$HOME/Ai_Robot_BE"
            fi

            # Clone repository if not present
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository into $PROJECT_DIR..."
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # Pull latest changes from active branch
            echo "Pulling latest code from ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Ensure .env is present
            if [ ! -f ".env" ]; then
              echo "❌ Error: .env file not found in $PROJECT_DIR!"
              echo "Please create $PROJECT_DIR/.env with your production secrets (e.g. cp .env.example .env)."
              exit 1
            fi

            # Run production EC2 deployment script
            chmod +x infrastructure/scripts/deploy-ec2.sh
            ./infrastructure/scripts/deploy-ec2.sh

